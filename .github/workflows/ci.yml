name: CLI checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  release-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: node --test scripts/*.test.mjs

  package-snapshot:
    if: ${{ !startsWith(github.ref, 'refs/tags/cli/v') }}
    runs-on: ubuntu-latest
    env:
      CLI_VERSION: 0.0.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Set reproducible build metadata
        run: |
          echo "BUILD_DATE=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"
          echo "FLINT_SCHEMA_HASH=$(sha256sum internal/spec/openapi.json | awk '{print $1}')" >> "$GITHUB_ENV"
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --snapshot --clean
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-install-snapshot
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          if-no-files-found: error

  installation:
    needs: package-snapshot
    uses: ./.github/workflows/install-checks.yml
    with:
      version: 0.0.0
      artifact: cli-install-snapshot

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Verify coverage report
        shell: bash
        run: |
          go run ./cmd/flint-coverage > "$RUNNER_TEMP/coverage.json"
          diff -u coverage.json "$RUNNER_TEMP/coverage.json"
      - name: Build
        run: go build -trimpath -buildvcs=false -o bin/ ./cmd/flint

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Install secret scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan source
        run: python3 scripts/check-secrets.py
