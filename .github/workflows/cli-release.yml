name: CLI Release

on:
  push:
    tags:
      - "cli/v*"

concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/cli/v') && 'cli-release-publish' || format('cli-release-{0}', github.ref) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require a release commit from main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-version.mjs "$RELEASE_TAG"

  verify:
    needs: release-policy
    uses: ./.github/workflows/ci.yml

  sandbox-listener-e2e:
    timeout-minutes: 5
    needs: verify
    if: ${{ startsWith(github.ref, 'refs/tags/cli/v') }}
    runs-on: ubuntu-latest
    environment: cli-release-sandbox
    env:
      FLINT_API_KEY: ${{ secrets.FLINT_TEST_API_KEY }}
      FLINT_NO_INPUT: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Require protected sandbox credentials
        run: test -n "$FLINT_API_KEY"
      - name: Exercise listener forwarding and signature verification
        run: |
          go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/flint" ./cmd/flint
          FLINT_BIN="$RUNNER_TEMP/flint" bash scripts/test-sandbox-listener.sh

  release:
    needs: [verify, sandbox-listener-e2e]
    if: ${{ startsWith(github.ref, 'refs/tags/cli/v') }}
    runs-on: ubuntu-latest
    outputs:
      build_date: ${{ steps.metadata.outputs.build_date }}
      cli_version: ${{ steps.metadata.outputs.cli_version }}
      docker_tags: ${{ steps.metadata.outputs.docker_tags }}
      is_prerelease: ${{ steps.metadata.outputs.is_prerelease }}
      npm_tag: ${{ steps.metadata.outputs.npm_tag }}
      schema_hash: ${{ steps.metadata.outputs.schema_hash }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Compute API schema hash
        id: metadata
        run: |
          cli_version="$(node scripts/release-version.mjs "$GITHUB_REF_NAME")"
          # Derive build metadata from the immutable source commit so rerunning
          # the same release tag produces byte-identical channel artifacts.
          build_date="$(git show -s --format=%cI "$GITHUB_SHA")"
          schema_hash="$(sha256sum internal/spec/openapi.json | awk '{print $1}')"
          {
            echo "FLINT_SCHEMA_HASH=$schema_hash"
            echo "CLI_VERSION=$cli_version"
            echo "BUILD_DATE=$build_date"
          } >> "$GITHUB_ENV"
          {
            echo "schema_hash=$schema_hash"
            echo "cli_version=$cli_version"
            echo "build_date=$build_date"
          } >> "$GITHUB_OUTPUT"
          if [[ "$cli_version" == *-* ]]; then
            {
              echo "IS_PRERELEASE=true"
              echo "NPM_TAG=next"
              echo "DOCKER_TAGS=ghcr.io/flint-pay/flint-cli:v${cli_version}"
            } >> "$GITHUB_ENV"
            {
              echo "is_prerelease=true"
              echo "npm_tag=next"
              echo "docker_tags=ghcr.io/flint-pay/flint-cli:v${cli_version}"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "IS_PRERELEASE=false"
              echo "NPM_TAG=latest"
              echo "DOCKER_TAGS=ghcr.io/flint-pay/flint-cli:v${cli_version},ghcr.io/flint-pay/flint-cli:latest"
            } >> "$GITHUB_ENV"
            {
              echo "is_prerelease=false"
              echo "npm_tag=latest"
              echo "docker_tags=ghcr.io/flint-pay/flint-cli:v${cli_version},ghcr.io/flint-pay/flint-cli:latest"
            } >> "$GITHUB_OUTPUT"
          fi
      # OSS GoReleaser rejects monorepo-prefixed tags as semantic versions. Snapshot mode builds the artifacts, and the next step publishes the protected tag.
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --snapshot --clean
        env:
          CLI_VERSION: ${{ env.CLI_VERSION }}
          BUILD_DATE: ${{ env.BUILD_DATE }}
          FLINT_SCHEMA_HASH: ${{ env.FLINT_SCHEMA_HASH }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flint-cli-release
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          if-no-files-found: error
  channel-preflight:
    needs: release
    if: ${{ startsWith(github.ref, 'refs/tags/cli/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26.7.0"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flint-cli-release
          path: dist
      - name: Match the publication npm version
        run: npm install --global npm@12.0.1
      - name: Validate every distribution package before publication
        env:
          FLINT_CLI_VERSION: ${{ needs.release.outputs.cli_version }}
        run: |
          (cd dist && sha256sum --check checksums.txt)
          node scripts/package-npm.mjs
          for package in dist/npm/*; do
            npm pack "$package" --dry-run --json >/dev/null
          done
          node scripts/render-homebrew-formula.mjs \
            "$FLINT_CLI_VERSION" \
            "$GITHUB_REF_NAME" \
            dist/checksums.txt >/tmp/flint.rb
          test -s /tmp/flint.rb
          docker build \
            --file Dockerfile \
            --build-arg VERSION="$FLINT_CLI_VERSION" \
            --build-arg COMMIT="$GITHUB_SHA" \
            --build-arg BUILD_DATE="${{ needs.release.outputs.build_date }}" \
            --build-arg SCHEMA_HASH="${{ needs.release.outputs.schema_hash }}" \
            .

  install-preflight:
    needs: release
    uses: ./.github/workflows/install-checks.yml
    with:
      version: ${{ needs.release.outputs.cli_version }}
      artifact: flint-cli-release

  publish-github:
    needs: [release, channel-preflight, install-preflight]
    if: ${{ startsWith(github.ref, 'refs/tags/cli/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flint-cli-release
          path: dist
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
      - name: Publish or verify GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLI_VERSION: ${{ needs.release.outputs.cli_version }}
          IS_PRERELEASE: ${{ needs.release.outputs.is_prerelease }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            verification_dir="$(mktemp -d)"
            gh release download "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern '*.tar.gz' \
              --pattern '*.zip' \
              --pattern checksums.txt \
              --dir "$verification_dir"
            cmp dist/checksums.txt "$verification_dir/checksums.txt"
            (cd "$verification_dir" && sha256sum --check checksums.txt)
            echo "GitHub release already contains the expected verified artifacts"
            exit 0
          fi
          release_flags=()
          if [ "$IS_PRERELEASE" = "true" ]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz \
            dist/*.zip \
            dist/checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Flint CLI ${CLI_VERSION}" \
            --generate-notes \
            --verify-tag \
            "${release_flags[@]}"

  homebrew:
    needs: [release, npm, docker, publish-github]
    if: ${{ needs.release.outputs.is_prerelease == 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26.7.0"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flint-cli-release
          path: dist
      - name: Publish Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          CLI_VERSION: ${{ needs.release.outputs.cli_version }}
        run: |
          tap_dir="$(mktemp -d)"
          gh auth setup-git
          gh repo clone flint-pay/homebrew-tap "$tap_dir"
          mkdir -p "$tap_dir/Formula"
          node scripts/render-homebrew-formula.mjs \
            "$CLI_VERSION" \
            "$GITHUB_REF_NAME" \
            dist/checksums.txt > "$tap_dir/Formula/flint.rb"
          git -C "$tap_dir" config user.name github-actions[bot]
          git -C "$tap_dir" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "$tap_dir" add Formula/flint.rb
          if git -C "$tap_dir" diff --cached --quiet; then
            echo "Homebrew formula already matches ${CLI_VERSION}"
          else
            git -C "$tap_dir" commit -m "flint ${CLI_VERSION}"
            git -C "$tap_dir" push origin HEAD
          fi

  npm:
    needs: [release, channel-preflight, install-preflight]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flint-cli-release
          path: dist
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26.7.0"
          registry-url: https://registry.npmjs.org
      - name: Enable npm trusted publishing
        run: npm install --global npm@12.0.1
      - name: Package npm platform binaries
        env:
          FLINT_CLI_VERSION: ${{ needs.release.outputs.cli_version }}
        run: node scripts/package-npm.mjs
      - name: Publish npm platform packages
        working-directory: dist/npm
        env:
          NPM_TAG: ${{ needs.release.outputs.npm_tag }}
        run: |
          publish_if_missing() {
            package_dir="$1"
            package_name="$(node -p "require('./${package_dir}/package.json').name")"
            package_version="$(node -p "require('./${package_dir}/package.json').version")"
            set +e
            view_output="$(npm view "${package_name}@${package_version}" dist.integrity 2>&1)"
            view_status=$?
            set -e
            if [ "$view_status" -eq 0 ]; then
              published_integrity="$view_output"
              local_integrity="$(npm pack "./${package_dir}" --dry-run --json | node "$GITHUB_WORKSPACE/scripts/npm-pack-result.mjs")"
              if [ "$published_integrity" != "$local_integrity" ]; then
                echo "Published ${package_name}@${package_version} does not match the local package" >&2
                exit 1
              fi
              echo "Verified existing ${package_name}@${package_version}"
              return
            fi
            if ! grep -q 'E404' <<<"$view_output"; then
              echo "$view_output" >&2
              return "$view_status"
            fi
            npm publish "./${package_dir}" --access public --provenance --tag "$NPM_TAG"
          }
          for package in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64 windows-amd64; do
            publish_if_missing "$package"
          done
          publish_if_missing wrapper

  docker:
    needs: [release, channel-preflight, install-preflight]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.release.outputs.docker_tags }}
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ needs.release.outputs.cli_version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ needs.release.outputs.build_date }}
            SCHEMA_HASH=${{ needs.release.outputs.schema_hash }}

  verify-published:
    needs: [release, publish-github, npm, homebrew]
    if: >-
      ${{ !cancelled() && needs.release.result == 'success' &&
          needs.publish-github.result == 'success' && needs.npm.result == 'success' &&
          (needs.homebrew.result == 'success' || needs.homebrew.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CLI_VERSION: ${{ needs.release.outputs.cli_version }}
      NPM_TAG: ${{ needs.release.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26.7.0"
          registry-url: https://registry.npmjs.org
      - name: Install the published npm package
        shell: bash
        run: bash scripts/verify-npm-install.sh
      - name: Install from the public release downloads
        shell: bash
        run: |
          FLINT_CLI_VERSION="$CLI_VERSION" FLINT_INSTALL_DIR="$RUNNER_TEMP/flint-manual" sh scripts/install.sh
          "$RUNNER_TEMP/flint-manual/flint" version --output json | \
            jq -e --arg version "$CLI_VERSION" '.data.cli_version == $version'
      - name: Install from the public Homebrew tap
        if: runner.os == 'macOS' && needs.release.outputs.is_prerelease == 'false'
        run: |
          brew install flint-pay/tap/flint
          brew test flint-pay/tap/flint
          "$(brew --prefix flint-pay/tap/flint)/bin/flint" version --output json | \
            jq -e --arg version "$CLI_VERSION" '.data.cli_version == $version'
