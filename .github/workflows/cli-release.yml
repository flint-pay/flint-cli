name: CLI Release

on:
  push:
    tags:
      - "cli/v*"

concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/cli/v') && 'cli-release-publish' || format('cli-release-{0}', github.ref) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require a release commit from main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-version.mjs "$RELEASE_TAG"

  verify:
    needs: release-policy
    uses: ./.github/workflows/ci.yml

  sandbox-listener-e2e:
    timeout-minutes: 5
    needs: verify
    if: ${{ startsWith(github.ref, 'refs/tags/cli/v') }}
    runs-on: ubuntu-latest
    environment: cli-release-sandbox
    outputs:
      waiver_reason: ${{ steps.waiver.outputs.waived == 'true' && vars.CLI_SANDBOX_WAIVER_REASON || '' }}
    env:
      FLINT_API_KEY: ${{ secrets.FLINT_TEST_API_KEY }}
      FLINT_NO_INPUT: "1"
      FLINT_BASE_URL: "https://api.staging.withflintpay.com"
    steps:
      - name: Record release-specific sandbox waiver
        id: waiver
        env:
          WAIVER_TAG: ${{ vars.CLI_SANDBOX_WAIVER_TAG }}
          WAIVER_REASON: ${{ vars.CLI_SANDBOX_WAIVER_REASON }}
        run: |
          if [ "$WAIVER_TAG" = "$GITHUB_REF_NAME" ] && [ -n "$WAIVER_REASON" ]; then
            echo 'waived=true' >> "$GITHUB_OUTPUT"
            printf 'Sandbox check waived for %s: %s\n' "$GITHUB_REF_NAME" "$WAIVER_REASON" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'waived=false' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.waiver.outputs.waived != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - if: steps.waiver.outputs.waived != 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Require protected sandbox credentials
        if: steps.waiver.outputs.waived != 'true'
        run: test -n "$FLINT_API_KEY"
      - name: Exercise listener forwarding and signature verification
        if: steps.waiver.outputs.waived != 'true'
        run: |
          go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/flint" ./cmd/flint
          FLINT_BIN="$RUNNER_TEMP/flint" bash scripts/test-sandbox-listener.sh

  release:
    needs: [verify, sandbox-listener-e2e]
    if: ${{ startsWith(github.ref, 'refs/tags/cli/v') }}
    runs-on: ubuntu-latest
    outputs:
      sandbox_waiver: ${{ needs.sandbox-listener-e2e.outputs.waiver_reason }}
      build_date: ${{ steps.metadata.outputs.build_date }}
      cli_version: ${{ steps.metadata.outputs.cli_version }}
      docker_tags: ${{ steps.metadata.outputs.docker_tags }}
      is_prerelease: ${{ steps.metadata.outputs.is_prerelease }}
      npm_tag: ${{ steps.metadata.outputs.npm_tag }}
      schema_hash: ${{ steps.metadata.outputs.schema_hash }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Compute API schema hash
        id: metadata
        run: |
          cli_version="$(node scripts/release-version.mjs "$GITHUB_REF_NAME")"
          # Derive build metadata from the immutable source commit so rerunning
          # the same release tag produces byte-identical channel artifacts.
          build_date="$(git show -s --format=%cI "$GITHUB_SHA")"
          schema_hash="$(sha256sum internal/spec/openapi.json | awk '{print $1}')"
          {
            echo "FLINT_SCHEMA_HASH=$schema_hash"
            echo "CLI_VERSION=$cli_version"
            echo "BUILD_DATE=$build_date"
          } >> "$GITHUB_ENV"
          {
            echo "schema_hash=$schema_hash"
            echo "cli_version=$cli_version"
            echo "build_date=$build_date"
          } >> "$GITHUB_OUTPUT"
          if [[ "$cli_version" == *-* ]]; then
            {
              echo "IS_PRERELEASE=true"
              echo "NPM_TAG=next"
              echo "DOCKER_TAGS=ghcr.io/flint-pay/flint-cli:v${cli_version}"
            } >> "$GITHUB_ENV"
            {
              echo "is_prerelease=true"
              echo "npm_tag=next"
              echo "docker_tags=ghcr.io/flint-pay/flint-cli:v${cli_version}"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "IS_PRERELEASE=false"
              echo "NPM_TAG=latest"
              echo "DOCKER_TAGS=ghcr.io/flint-pay/flint-cli:v${cli_version},ghcr.io/flint-pay/flint-cli:latest"
            } >> "$GITHUB_ENV"
            {
              echo "is_prerelease=false"
              echo "npm_tag=latest"
              echo "docker_tags=ghcr.io/flint-pay/flint-cli:v${cli_version},ghcr.io/flint-pay/flint-cli:latest"
            } >> "$GITHUB_OUTPUT"
          fi
      # OSS GoReleaser rejects monorepo-prefixed tags as semantic versions. Snapshot mode builds the artifacts, and the next step publishes the protected tag.
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --snapshot --clean
        env:
          CLI_VERSION: ${{ env.CLI_VERSION }}
          BUILD_DATE: ${{ env.BUILD_DATE }}
          FLINT_SCHEMA_HASH: ${{ env.FLINT_SCHEMA_HASH }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flint-cli-release
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          if-no-files-found: error
  channel-preflight:
    needs: release
    if: ${{ startsWith(github.ref, 'refs/tags/cli/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26.7.0"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flint-cli-release
          path: dist
      - name: Match the publication npm version
        run: npm install --global npm@12.0.1
      - name: Validate every distribution package before publication
        env:
          FLINT_CLI_VERSION: ${{ needs.release.outputs.cli_version }}
        run: |
          (cd dist && sha256sum --check checksums.txt)
          node scripts/package-npm.mjs
          node scripts/pack-npm.mjs
          node scripts/render-homebrew-formula.mjs \
            "$FLINT_CLI_VERSION" \
            "$GITHUB_REF_NAME" \
            dist/checksums.txt >dist/flint.rb
          test -s dist/flint.rb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flint-cli-channels
          path: |
            dist/npm-packages/*.tgz
            dist/flint.rb
          if-no-files-found: error

  container-build:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Prepare the OCI export directory
        run: mkdir -p "$RUNNER_TEMP/container"
      - name: Build the reviewable container without registry writes
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/container/container.oci.tar
          tags: ghcr.io/flint-pay/flint-cli:v${{ needs.release.outputs.cli_version }}
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ needs.release.outputs.cli_version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ needs.release.outputs.build_date }}
            SCHEMA_HASH=${{ needs.release.outputs.schema_hash }}
      - name: Record the exported OCI manifest digest
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo
          skopeo inspect --raw "oci-archive:$RUNNER_TEMP/container/container.oci.tar" > "$RUNNER_TEMP/container/manifest.json"
          printf 'sha256:%s\n' "$(sha256sum "$RUNNER_TEMP/container/manifest.json" | awk '{print $1}')" > "$RUNNER_TEMP/container/container-digest.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flint-cli-container
          path: |
            ${{ runner.temp }}/container/container.oci.tar
            ${{ runner.temp }}/container/container-digest.txt
          if-no-files-found: error

  frozen-compare:
    needs: [release, channel-preflight, install-preflight, container-build]
    runs-on: ubuntu-latest
    outputs:
      review_sha256: ${{ steps.compare.outputs.review_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26.7.0"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flint-cli-release
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flint-cli-channels
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flint-cli-container
          path: dist
      - name: Capture the candidate publication manifest
        run: |
          node scripts/release-manifest.mjs create dist \
            "$GITHUB_REF_NAME" "$GITHUB_SHA" \
            "${{ needs.release.outputs.build_date }}" \
            "${{ needs.release.outputs.schema_hash }}" > dist/candidate-release.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flint-cli-candidate-manifest
          path: dist/candidate-release.json
          if-no-files-found: error
          overwrite: true
      - name: Require the externally frozen review to match every channel
        id: compare
        env:
          CLI_RELEASE_REVIEW_MANIFEST: ${{ vars.CLI_RELEASE_REVIEW_MANIFEST }}
          CLI_RELEASE_REVIEW_SHA256: ${{ vars.CLI_RELEASE_REVIEW_SHA256 }}
        run: node scripts/release-manifest.mjs compare dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flint-cli-reviewed-manifest
          path: dist/reviewed-release.json
          if-no-files-found: error
          overwrite: true

  publication-approval:
    needs: frozen-compare
    runs-on: ubuntu-latest
    # Reuse the protected npm environment as the approval barrier for every
    # publisher. Repository configuration must require maintainer review here.
    environment: npm
    steps:
      - name: Record the approved frozen comparison
        env:
          REVIEW_SHA256: ${{ needs.frozen-compare.outputs.review_sha256 }}
        run: |
          test -n "$REVIEW_SHA256"
          printf 'Approved frozen publication manifest SHA-256: %s\n' "$REVIEW_SHA256" >> "$GITHUB_STEP_SUMMARY"

  install-preflight:
    needs: release
    uses: ./.github/workflows/install-checks.yml
    with:
      version: ${{ needs.release.outputs.cli_version }}
      artifact: flint-cli-release

  publish-github:
    # GitHub releases drive CLI update discovery, so npm must be installable
    # before this version becomes visible to existing npm installations.
    needs: [release, frozen-compare, publication-approval, npm-readiness]
    if: ${{ startsWith(github.ref, 'refs/tags/cli/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26.7.0"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flint-cli-release
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flint-cli-reviewed-manifest
          path: dist
      - name: Verify approved GitHub publication bytes
        run: node scripts/release-manifest.mjs verify dist archives "${{ needs.frozen-compare.outputs.review_sha256 }}" "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
      - name: Publish or verify GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLI_VERSION: ${{ needs.release.outputs.cli_version }}
          IS_PRERELEASE: ${{ needs.release.outputs.is_prerelease }}
          SANDBOX_WAIVER: ${{ needs.release.outputs.sandbox_waiver }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            verification_dir="$(mktemp -d)"
            gh release download "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern '*.tar.gz' \
              --pattern '*.zip' \
              --pattern checksums.txt \
              --dir "$verification_dir"
            cmp dist/checksums.txt "$verification_dir/checksums.txt"
            (cd "$verification_dir" && sha256sum --check checksums.txt)
            echo "GitHub release already contains the expected verified artifacts"
            exit 0
          fi
          release_flags=()
          if [ -n "$SANDBOX_WAIVER" ]; then
            printf 'Known issue: %s\n' "$SANDBOX_WAIVER" > "$RUNNER_TEMP/release-notes.md"
            release_flags+=(--notes-file "$RUNNER_TEMP/release-notes.md")
          fi
          if [ "$IS_PRERELEASE" = "true" ]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz \
            dist/*.zip \
            dist/checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Flint CLI ${CLI_VERSION}" \
            --generate-notes \
            --verify-tag \
            "${release_flags[@]}"

  homebrew:
    needs: [release, frozen-compare, publication-approval, npm, docker, publish-github]
    if: ${{ needs.release.outputs.is_prerelease == 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26.7.0"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flint-cli-channels
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flint-cli-reviewed-manifest
          path: dist
      - name: Verify approved Homebrew formula
        run: node scripts/release-manifest.mjs verify dist homebrew "${{ needs.frozen-compare.outputs.review_sha256 }}" "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Publish Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          CLI_VERSION: ${{ needs.release.outputs.cli_version }}
        run: |
          tap_dir="$(mktemp -d)"
          gh auth setup-git
          gh repo clone flint-pay/homebrew-tap "$tap_dir"
          mkdir -p "$tap_dir/Formula"
          cp dist/flint.rb "$tap_dir/Formula/flint.rb"
          git -C "$tap_dir" config user.name github-actions[bot]
          git -C "$tap_dir" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "$tap_dir" add Formula/flint.rb
          if git -C "$tap_dir" diff --cached --quiet; then
            echo "Homebrew formula already matches ${CLI_VERSION}"
          else
            git -C "$tap_dir" commit -m "flint ${CLI_VERSION}"
            git -C "$tap_dir" push origin HEAD
          fi

  npm:
    needs: [release, frozen-compare, publication-approval]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flint-cli-channels
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flint-cli-reviewed-manifest
          path: dist
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26.7.0"
          registry-url: https://registry.npmjs.org
      - name: Enable npm trusted publishing
        run: npm install --global npm@12.0.1
      - name: Publish npm platform packages
        run: node scripts/publish-npm.mjs dist "${{ needs.frozen-compare.outputs.review_sha256 }}" "$GITHUB_REF_NAME" "$GITHUB_SHA"

  npm-readiness:
    needs: [release, npm]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CLI_VERSION: ${{ needs.release.outputs.cli_version }}
      NPM_TAG: ${{ needs.release.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26.7.0"
          registry-url: https://registry.npmjs.org
      - name: Wait for public npm installation before update discovery
        shell: bash
        run: bash scripts/verify-npm-install.sh

  docker:
    needs: [release, frozen-compare, publication-approval]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26.7.0"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flint-cli-container
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flint-cli-reviewed-manifest
          path: dist
      - name: Publish or verify the immutable reviewed container
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo
          node scripts/publish-container.mjs dist "${{ needs.frozen-compare.outputs.review_sha256 }}" "$GITHUB_REF_NAME" "$GITHUB_SHA" "$HOME/.docker/config.json"

  verify-published:
    needs: [release, publish-github, npm, docker, homebrew]
    if: >-
      ${{ !cancelled() && needs.release.result == 'success' &&
          needs.publish-github.result == 'success' && needs.npm.result == 'success' && needs.docker.result == 'success' &&
          (needs.homebrew.result == 'success' || needs.homebrew.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CLI_VERSION: ${{ needs.release.outputs.cli_version }}
      NPM_TAG: ${{ needs.release.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26.7.0"
          registry-url: https://registry.npmjs.org
      - name: Install the published npm package
        shell: bash
        run: bash scripts/verify-npm-install.sh
      - name: Install from the public release downloads
        shell: bash
        run: |
          FLINT_CLI_VERSION="$CLI_VERSION" FLINT_INSTALL_DIR="$RUNNER_TEMP/flint-manual" sh scripts/install.sh
          "$RUNNER_TEMP/flint-manual/flint" version --output json | \
            jq -e --arg version "$CLI_VERSION" '.data.cli_version == $version'
      - name: Install from the public Homebrew tap
        if: runner.os == 'macOS' && needs.release.outputs.is_prerelease == 'false'
        run: |
          brew install flint-pay/tap/flint
          brew test flint-pay/tap/flint
          "$(brew --prefix flint-pay/tap/flint)/bin/flint" version --output json | \
            jq -e --arg version "$CLI_VERSION" '.data.cli_version == $version'
